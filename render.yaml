services:
  - type: web
    name: dead-and-injured
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript and Vite, which are devDependencies.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Optional: powers the leaderboard. Paste the *internal* connection string of your
      # Render Postgres database in the dashboard (never commit it). Leave it unset to
      # run without a database.
      - key: DATABASE_URL
        sync: false
