databases:
  - name: dead-and-injured-db
    plan: free

services:
  - type: web
    name: dead-and-injured
    runtime: node
    plan: free
    # --include=dev: the build needs TypeScript and Vite, which are devDependencies.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Optional: powers the leaderboard. Remove this to run without a database.
      - key: DATABASE_URL
        fromDatabase:
          name: dead-and-injured-db
          property: connectionString
